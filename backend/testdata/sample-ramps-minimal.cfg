# Minimal RAMPS 1.4 bench config for goklippy development/tests
[mcu]
serial: /dev/ttyUSB0
baud: 250000

[printer]
kinematics: none
max_velocity: 100
max_accel: 100

[stepper_x]
step_pin: ar54
dir_pin: ar55
enable_pin: !ar38
microsteps: 16
rotation_distance: 40

[temperature_sensor test_hotend]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog13

[fan]
pin: ar9

[servo probe_servo]
pin: ar11
maximum_servo_angle: 180
