[mcu]
serial: /dev/ttyUSB0
baud: 250000

[printer]
kinematics: none
max_velocity: 100
max_accel: 100

[stepper_x]
step_pin: ar54
dir_pin: ar55
enable_pin: !ar38
microsteps: 16
rotation_distance: 40

[stepper_y]
enable_pin: !ar56
microsteps: 16
rotation_distance: 40
step_pin: ar60
dir_pin: ar61

[servo 0]
maximum_servo_angle: 180
pin: ar11

[stepper_z]
step_pin: ar46
dir_pin: ar48
enable_pin: !ar62
microsteps: 16
rotation_distance: 40

[stepper_e0]
enable_pin: !ar24
microsteps: 16
rotation_distance: 40
step_pin: ar26
dir_pin: ar28

[output_pin leds]
pin: ar10
value: 0
shutdown_value: 0
maximum_mcu_duration: 5
